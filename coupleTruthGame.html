<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>情侣暧昧真心话【联机版】</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
body{background:#fef0f6;padding:16px;color:#333}
.container{max-width:600px;margin:0 auto}
.btn{display:block;width:100%;border:none;border-radius:99px;padding:14px;font-size:18px;margin:10px 0;cursor:pointer}
.btn-pink{background:#e85b9c;color:white;font-weight:bold}
.btn-blue{background:#4285F4;color:white;font-weight:bold}
.player-card{background:#fff;border-radius:20px;padding:20px;margin:12px 0;text-align:center;border:1px solid #f8c8e0}
.question-box,.punish-box,.answer-box{background:#fff;border-radius:20px;padding:24px;margin:14px 0;text-align:center;border:1px solid #f8c8e0;font-size:22px}
.answer-input-area{margin-top:16px}
#answerInput{width:100%;border:1px solid #f0b8d8;border-radius:16px;padding:14px;font-size:18px;min-height:100px;outline:none}
#submitAnswerBtn{background:#7b41c9;color:white}
.tip-text{color:#c84078;font-size:16px;margin-top:8px;display:none}
.loading{text-align:center;color:#d04080;font-size:16px;margin:10px}
.room-tip{color:#884499;text-align:center;margin:4px 0 12px;font-size:15px;}
</style>
</head>
<body>
<div class="container">
    <h2 style="text-align:center;color:#d04080">情侣暧昧真心话【联机版】</h2>
    <div class="loading" id="loadingText">正在同步联机数据...</div>
    <div>
        <input type="text" id="nameInput" placeholder="输入你的昵称加入游戏" style="width:100%;padding:12px;border-radius:12px;border:1px solid #f0b8d8;font-size:18px;margin:10px 0;">
        <button class="btn btn-pink" onclick="addPlayer()">加入游戏</button>
    </div>
    <button class="btn btn-blue" onclick="refreshRoom()">🔄 刷新联机状态</button>
    <div class="room-tip">💡 多人联机提示：其他人操作后，请点【🔄 刷新联机状态】，才能看到最新玩家、题目和回答</div>
    <button class="btn btn-pink" onclick="shufflePlayers()">随机抽签排序</button>
    <button class="btn btn-pink" onclick="nextQuestion()">抽取问题+奖惩</button>
    <button class="btn btn-pink" onclick="resetGame()">重置游戏</button>

    <div id="turnInfo" style="font-size:24px;color:#d04080;font-weight:bold;margin:20px 0;text-align:center"></div>
    <div id="playerList"></div>
    <div id="questionBox" class="question-box"></div>
    <div id="punishBox" class="punish-box"></div>

    <!-- 回答输入区域 -->
    <div class="answer-input-area">
        <textarea id="answerInput" placeholder="在这里写下本轮你的回答..."></textarea>
        <button id="submitAnswerBtn" class="btn" onclick="submitAnswer()">提交回答</button>
        <div id="tipText" class="tip-text">✅回答已提交！请点击【抽取问题+奖惩】切换到下一位玩家</div>
        <div id="savedAnswerBox" class="answer-box" style="display:none;"></div>
    </div>
</div>

<script>
const BIN_ID = "66e52a32ad19ca64cf8c3175";
const MASTER_KEY = "$2a$10$vI8aWBnW3fID.ZQ4/zo1G.q1lRps.9cGLcZEiGDMVr5yUP1KUOYTa";

const questionList = [
    "有没有某一刻，你特别想抱抱我？",
    "第一次见我的时候，你心里是什么印象？",
    "你最喜欢我身上哪一点？",
    "如果可以，最想和我去哪里旅行？",
    "你记忆里和我最甜的一件小事是什么？",
    "你会因为什么事情偷偷想我？",
    "你最想和我一起完成什么事？",
    "你觉得两个人在一起最重要的是什么？"
];
const rewardList = [
    "奖励：获得一次指定对方做一件小事的机会",
    "奖励：对方夸你三句",
    "奖励：你可以指定对方发一张自拍",
    "奖励：对方满足你一个小愿望（不超出底线）"
];
const punishList = [
    "小惩罚：对全场玩家温柔表白一次",
    "小惩罚：说出你最近一次想到我的瞬间",
    "小惩罚：用三种不同语气说我喜欢你",
    "小惩罚：描述你理想中和我的周末一天"
];

// 从云端拉取游戏数据
async function loadCloudData(){
    try{
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`,{
            headers:{"X-Master-Key":MASTER_KEY}
        })
        const json = await res.json();
        return json.record;
    }catch(e){
        console.log("拉取云端失败，初始化新房间");
        return {
            players:[],
            nowIndex:0,
            isSort:false,
            currentQuestion:"",
            currentRule:"",
            lastAnswer:""
        };
    }
}

// 保存数据上传云端
async function saveCloudData(data){
    await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`,{
        method:"PUT",
        headers:{
            "X-Master-Key":MASTER_KEY,
            "Content-Type":"application/json"
        },
        body:JSON.stringify(data)
    })
}

// 渲染页面
async function render(){
    document.getElementById("loadingText").innerText="同步数据中...";
    const state = await loadCloudData();
    const list = state.players;
    let html = "";
    list.forEach((p,idx)=>{
        html += `<div class="player-card"><div style="font-size:28px">${p.emoji} ${p.name}</div><div style="font-size:20px;color:#b74878">第${idx+1}位</div></div>`
    })
    document.getElementById("playerList").innerHTML = html;
    if(state.isSort && list[state.nowIndex]){
        document.getElementById("turnInfo").innerText = `本轮答题：${list[state.nowIndex].emoji} ${list[state.nowIndex].name}`;
    }else{
        document.getElementById("turnInfo").innerText = "";
    }
    document.getElementById("questionBox").innerText = state.currentQuestion;
    document.getElementById("punishBox").innerText = state.currentRule;
    if(state.lastAnswer){
        document.getElementById("savedAnswerBox").style.display="block";
        document.getElementById("savedAnswerBox").innerText = `📝本轮回答：${state.lastAnswer}`;
    }else{
        document.getElementById("savedAnswerBox").style.display="none";
    }
    document.getElementById("loadingText").innerText="✅联机已连接";
}

// 手动刷新房间
async function refreshRoom(){
    await render();
    alert("已刷新房间最新数据！");
}

// 添加玩家
async function addPlayer(){
    const name = document.getElementById("nameInput").value.trim();
    if(!name)return alert("请输入昵称");
    const state = await loadCloudData();
    const emojis = ["🐱","🐶","🐰","🦊","🐼","🐨","🐹","🐯"];
    state.players.push({name,emoji:emojis[Math.floor(Math.random()*emojis.length)]});
    await saveCloudData(state);
    document.getElementById("nameInput").value="";
    render();
}

// 打乱玩家顺序
async function shufflePlayers(){
    const state = await loadCloudData();
    let arr = state.players;
    for(let i=arr.length-1;i>0;i--){
        let j = Math.floor(Math.random()*(i+1));
        [arr[i],arr[j]] = [arr[j],arr[i]];
    }
    state.isSort = true;
    state.nowIndex = 0;
    state.currentQuestion = "";
    state.currentRule = "";
    state.lastAnswer = "";
    await saveCloudData(state);
    render();
}

// 抽取新题目奖惩
async function nextQuestion(){
    const state = await loadCloudData();
    const allPlayers = state.players;
    if(!state.isSort) return alert("请先随机抽签排序！");
    let randomQ = questionList[Math.floor(Math.random()*questionList.length)];
    let isReward = Math.random() > 0.5;
    let randomRule = isReward ? rewardList[Math.floor(Math.random()*rewardList.length)] : punishList[Math.floor(Math.random()*punishList.length)];
    state.currentQuestion = randomQ;
    state.currentRule = randomRule;
    state.lastAnswer = "";
    await saveCloudData(state);
    render();
    document.getElementById("answerInput").value="";
    document.getElementById("tipText").style.display="none";
}

// 提交回答（云端保存，所有人可见）
async function submitAnswer(){
    const ans = document.getElementById("answerInput").value.trim();
    if(!ans) return alert("请输入回答内容");
    const state = await loadCloudData();
    state.lastAnswer = ans;
    await saveCloudData(state);
    render();
    document.getElementById("tipText").style.display="block";
}

// 全局重置游戏，清空全部联机房间数据
async function resetGame(){
    const emptyData = {
        players:[],
        nowIndex:0,
        isSort:false,
        currentQuestion:"",
        currentRule:"",
        lastAnswer:""
    };
    await saveCloudData(emptyData);
    render();
    document.getElementById("answerInput").value="";
    document.getElementById("tipText").style.display="none";
}

window.onload = function(){
    render();
}
</script>
</body>
</html>
