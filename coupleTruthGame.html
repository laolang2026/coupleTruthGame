<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>情侣真心话联机游戏</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            max-width: 600px;
            margin: 2rem auto;
            padding: 0 1rem;
            background: #f7f8fa;
        }
        .card {
            background: white;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            margin-bottom:16px;
        }
        button {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            background: #4285f4;
            color:white;
            font-size:16px;
            cursor:pointer;
            margin:4px;
        }
        button:hover {
            background:#3367d6;
        }
        input {
            padding:10px;
            border:1px solid #ddd;
            border-radius:8px;
            width:70%;
            font-size:16px;
        }
        #playerList {
            padding:8px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>情侣真心话联机游戏</h2>
        <div>
            <input id="nickInput" placeholder="输入你的昵称">
            <button onclick="joinGame()">加入游戏</button>
        </div>
        <div style="margin-top:12px;">
            <button onclick="loadRoom()">🔄 刷新联机房间</button>
            <p style="color:#666; font-size:14px;">💡 多人联机提示：其他人操作后，请点【刷新联机房间】获取最新房间数据</p>
        </div>
    </div>

    <div class="card">
        <h3>在线玩家</h3>
        <div id="playerList"></div>
        <button onclick="shufflePlayers()">随机排序玩家</button>
    </div>

    <div class="card">
        <h3>当前题目</h3>
        <div id="questionBox"></div>
        <button onclick="nextQuestion()">下一题</button>
    </div>

    <div class="card">
        <h3>回答</h3>
        <div>
            <input id="answerInput" placeholder="输入你的回答">
            <button onclick="submitAnswer()">提交回答</button>
        </div>
        <div id="answerBox"></div>
    </div>

<script>
// ==========这里是你自己的BIN配置==========
const BIN_ID = "6aa7c834ffd5d16053047826";
const MASTER_KEY = "$2a$10$/qptXbvvsuTtaC2HxscUEOBhce9T0x1/aHg/Y31CGBdJNCfIyukza";
const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

// 题库
const questionList = [
    "你第一次见我的印象是什么？",
    "你最喜欢我身上哪个地方？",
    "最近最想和我一起做什么事？",
    "你觉得我们最默契的瞬间是哪次？",
    "有没有哪一刻特别想我？",
    "如果可以，最想和我去哪里旅行？",
    "我做什么事最容易让你开心？",
    "你觉得两个人在一起最重要的是什么？"
];

// 读取房间数据
async function loadRoom() {
    const res = await fetch(API_URL, {
        method:"GET",
        headers: {
            "X-Master-Key": MASTER_KEY
        }
    });
    const data = await res.json();
    const room = data.record;
    renderRoom(room);
    return room;
}

// 渲染页面
function renderRoom(room) {
    //渲染玩家
    const playerDom = document.getElementById("playerList");
    playerDom.innerHTML = room.players.map((p,i)=>`<p>${i+1}. ${p}</p>`).join("");
    //渲染题目
    document.getElementById("questionBox").innerText = room.currentQuestion || "等待开始";
    //渲染回答
    document.getElementById("answerBox").innerText = room.lastAnswer ? `上一条回答：${room.lastAnswer}` : "暂无回答";
}

// 保存房间数据到jsonbin
async function saveRoom(room) {
    await fetch(API_URL, {
        method:"PUT",
        headers: {
            "X-Master-Key": MASTER_KEY,
            "Content-Type": "application/json"
        },
        body: JSON.stringify(room)
    });
}

// 加入游戏
async function joinGame() {
    const nick = document.getElementById("nickInput").value.trim();
    if(!nick) return alert("请输入昵称");
    const room = await loadRoom();
    if(!room.players.includes(nick)){
        room.players.push(nick);
        await saveRoom(room);
    }
    await loadRoom();
    alert("加入成功！");
}

// 随机排序玩家
async function shufflePlayers() {
    const room = await loadRoom();
    room.players.sort(()=>Math.random()-0.5);
    room.isSort = true;
    await saveRoom(room);
    await loadRoom();
}

// 切换下一题
async function nextQuestion() {
    const room = await loadRoom();
    const randomIdx = Math.floor(Math.random()*questionList.length);
    room.currentQuestion = questionList[randomIdx];
    room.lastAnswer = "";
    await saveRoom(room);
    await loadRoom();
}

// 提交回答
async function submitAnswer() {
    const ans = document.getElementById("answerInput").value.trim();
    if(!ans) return alert("请输入回答");
    const room = await loadRoom();
    room.lastAnswer = ans;
    await saveRoom(room);
    await loadRoom();
}

// 页面加载自动拉取房间
window.onload = loadRoom;
</script>
</body>
</html>
